[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tagscan"
version = "0.1.0"
description = "Interactive TAG-lens two-photon scan-volume explorer (scalar Debye wave model)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "pyvista>=0.43",
  "pyvistaqt>=0.11",
  "PySide6>=6.5",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
tagscan = "tagscan.app:main"

[tool.setuptools]
packages = ["tagscan"]
